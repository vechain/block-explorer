name: Build & Publish Release Image

# The content SHA is the canonical tag; the semver tags are aliases on the same
# manifest. A release that changes nothing the build reads finds its SHA tag
# already in GHCR and only adds the aliases, which is also what lets the deploys
# skip their ECS roll. See scripts/app-content-sha.sh.

on:
  push:
    tags:
      - v.*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v.1.0.0)'
        required: true
        type: string

concurrency:
  group: ghcr-block-explorer-${{ github.ref }}
  cancel-in-progress: false

env:
  versionTag: ${{ inputs.version || github.ref_name }}
  ghcrRegistry: ghcr.io
  dockerHubRegistry: docker.io
  imageName: ${{ github.repository }}
  dockerHubImage: vechain/block-explorer

jobs:
  # Resolves the content SHA and asks GHCR whether that image already exists.
  # Everything below keys off `exists`.
  detect:
    name: Resolve Content SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      app_sha: ${{ steps.sha.outputs.app_sha }}
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script walks back to the last commit touching an app path.
          fetch-depth: 0

      # At HEAD, which is what the build below actually builds. On the tag push
      # that is the tag; on a dispatch it is the checked-out ref, same as before.
      - name: Resolve content SHA
        id: sha
        run: |
          set -euo pipefail
          APP_SHA=$(bash scripts/app-content-sha.sh)
          echo "app_sha=${APP_SHA}" >> "$GITHUB_OUTPUT"
          echo "Content SHA: ${APP_SHA}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ghcrRegistry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe GHCR for the content SHA
        id: probe
        env:
          IMAGE: ${{ env.ghcrRegistry }}/${{ env.imageName }}:${{ steps.sha.outputs.app_sha }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE} is already published — the release only needs its aliases."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE} is not published — building."
          fi

  build:
    needs: detect
    if: needs.detect.outputs.exists == 'false'
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ghcrRegistry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build args sit outside the content hash — read app-content-sha.sh before adding one.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.versionTag }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
          outputs: type=image,name=${{ env.ghcrRegistry }}/${{ env.imageName }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs on a skipped `build` too — that is the alias path.
  merge:
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: always() && needs.detect.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    permissions:
      actions: read
      packages: write

    steps:
      - name: Download digests
        if: needs.detect.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ghcrRegistry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.dockerHubRegistry }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tags
        id: version
        run: |
          # Strip v. prefix from version tag
          VERSION=$(echo "${{ env.versionTag }}" | sed 's/^v\.//')
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"

          # Only publish floating tags for stable versions (X.Y.Z)
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GHCR manifest list
        env:
          GHCR_IMAGE: ${{ env.ghcrRegistry }}/${{ env.imageName }}
          APP_SHA: ${{ needs.detect.outputs.app_sha }}
          EXISTS: ${{ needs.detect.outputs.exists }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          STABLE: ${{ steps.version.outputs.stable }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail

          tags=("-t" "${GHCR_IMAGE}:${FULL_VERSION}")
          if [ "${STABLE}" = "true" ]; then
            tags+=("-t" "${GHCR_IMAGE}:${MINOR}")
            tags+=("-t" "${GHCR_IMAGE}:${MAJOR}")
            tags+=("-t" "${GHCR_IMAGE}:latest")
          fi

          if [ "${EXISTS}" = "true" ]; then
            # Nothing was built: the aliases are pointed at the manifest already
            # under the content SHA, and no layers move.
            refs=("${GHCR_IMAGE}:${APP_SHA}")
          else
            tags+=("-t" "${GHCR_IMAGE}:${APP_SHA}")
            refs=()
            for digest in /tmp/digests/*; do
              refs+=("${GHCR_IMAGE}@sha256:${digest##*/}")
            done
          fi

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Mirror manifest from GHCR to Docker Hub
        env:
          GHCR_IMAGE: ${{ env.ghcrRegistry }}/${{ env.imageName }}
          DOCKERHUB_IMAGE: ${{ env.dockerHubRegistry }}/${{ env.dockerHubImage }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          STABLE: ${{ steps.version.outputs.stable }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail

          copy_tag() {
            local tag="$1"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${tag}" "${GHCR_IMAGE}:${tag}"
          }

          copy_tag "${FULL_VERSION}"
          if [ "${STABLE}" = "true" ]; then
            copy_tag "${MINOR}"
            copy_tag "${MAJOR}"
            copy_tag "latest"
          fi

      - name: Summary
        env:
          VERSION_TAG: ${{ env.versionTag }}
          APP_SHA: ${{ needs.detect.outputs.app_sha }}
          EXISTS: ${{ needs.detect.outputs.exists }}
        run: |
          {
            echo "### ${VERSION_TAG}"
            echo
            if [ "${EXISTS}" = "true" ]; then
              echo "Build **skipped** — \`${APP_SHA}\` was already published, so this release is an alias on the same manifest."
            else
              echo "Built and published as \`${APP_SHA}\`, with \`${VERSION_TAG}\` aliased to it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
