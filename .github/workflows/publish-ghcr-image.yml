name: Build & Publish GHCR Image

on:
  push:
    tags:
      - v.*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v.1.0.0)'
        required: true
        type: string

concurrency:
  group: ghcr-block-explorer-${{ github.ref }}
  cancel-in-progress: false

env:
  versionTag: ${{ inputs.version || github.ref_name }}
  registry: ghcr.io

jobs:
  build:
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.versionTag }}
          context: ./
          provenance: false
          sbom: false
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
          outputs: type=image,name=${{ env.registry }}/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tags
        id: version
        run: |
          # Strip v. prefix from version tag
          VERSION=$(echo "${{ env.versionTag }}" | sed 's/^v\.//')
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"

          # Only publish floating tags for stable versions (X.Y.Z)
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.registry }}/${{ github.repository }}
        run: |
          TAGS="-t ${{ env.IMAGE }}:${{ steps.version.outputs.full }}"

          if [ "${{ steps.version.outputs.stable }}" = "true" ]; then
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}"
            TAGS="$TAGS -t ${{ env.IMAGE }}:${{ steps.version.outputs.major }}"
            TAGS="$TAGS -t ${{ env.IMAGE }}:latest"
          fi

          IMAGE_REFS=()
          for digest in *; do
            IMAGE_REFS+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            $TAGS \
            "${IMAGE_REFS[@]}"
