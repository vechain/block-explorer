name: Build and Push to ECR

on:
    workflow_call:
        inputs:
            ecr_repository:
                description: "Name of the ECR repository"
                required: true
                type: string
            image_tag:
                description: "Tag for the Docker image"
                required: true
                type: string
            dockerfile_path:
                description: "Path to Dockerfile"
                required: false
                type: string
                default: "./Dockerfile"
            context_path:
                description: "Build context path"
                required: false
                type: string
                default: "."
            aws_region:
                description: "AWS region"
                required: false
                type: string
                default: "eu-west-1"
            environment_name:
                description: "GitHub Environment to scope AWS credentials to"
                required: true
                type: string
        secrets:
            aws_role_arn:
                description: "AWS IAM role ARN for OIDC authentication"
                required: true
        outputs:
            tag:
                description: "The image tag that was pushed"
                value: ${{ jobs.build-and-push.outputs.tag }}
            uri:
                description: "Full URI of the pushed image"
                value: ${{ jobs.build-and-push.outputs.uri }}

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        environment:
            name: ${{ inputs.environment_name }}
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
            uri: ${{ steps.meta.outputs.uri }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  aws-region: ${{ inputs.aws_region }}
                  role-to-assume: ${{ secrets.aws_role_arn }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

            - name: Generate image metadata
              id: meta
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
                  ECR_REPOSITORY: ${{ inputs.ecr_repository }}
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                  echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: Build and push Docker image
              uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
              with:
                  context: ${{ inputs.context_path }}
                  file: ${{ inputs.dockerfile_path }}
                  push: true
                  tags: ${{ steps.meta.outputs.uri }}
                  platforms: linux/amd64
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_APP_VERSION=${{ inputs.image_tag }}
