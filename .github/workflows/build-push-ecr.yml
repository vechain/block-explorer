name: Build and Push to ECR

on:
    workflow_call:
        inputs:
            ecr_repository:
                description: "Name of the ECR repository"
                required: true
                type: string
            image_tag:
                description: "Tag for the Docker image"
                required: true
                type: string
            dockerfile_path:
                description: "Path to Dockerfile"
                required: false
                type: string
                default: "./Dockerfile"
            context_path:
                description: "Build context path"
                required: false
                type: string
                default: "."
            aws_region:
                description: "AWS region"
                required: false
                type: string
                default: "eu-west-1"
            environment_name:
                description: "GitHub Environment to scope AWS credentials to"
                required: true
                type: string
        secrets:
            aws_role_arn:
                description: "AWS IAM role ARN for OIDC authentication"
                required: true
        outputs:
            tag:
                description: "The image tag that was pushed"
                value: ${{ jobs.build-and-push.outputs.tag }}
            uri:
                description: "Full URI of the pushed image"
                value: ${{ jobs.build-and-push.outputs.uri }}

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        environment:
            name: ${{ inputs.environment_name }}
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
            uri: ${{ steps.meta.outputs.uri }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  aws-region: ${{ inputs.aws_region }}
                  role-to-assume: ${{ secrets.aws_role_arn }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

            - name: Generate image metadata
              id: meta
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
                  ECR_REPOSITORY: ${{ inputs.ecr_repository }}
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                  echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build and push Docker image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: ${{ inputs.context_path }}
                  file: ${{ inputs.dockerfile_path }}
                  push: true
                  tags: ${{ steps.meta.outputs.uri }}
                  platforms: linux/amd64
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_APP_VERSION=${{ inputs.image_tag }}
