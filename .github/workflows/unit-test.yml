name: Run Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Version comes from package.json's packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm ts-check

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  identity:
    name: Resolve Content SHA
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      app_sha: ${{ steps.sha.outputs.app_sha }}
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      # The default branch, in its own job: the script that names the bundle must not be one a pull
      # request can edit, or a PR could publish under a release's name.
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve content SHA
        id: sha
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${HEAD_SHA}^{commit}" >/dev/null 2>&1 || git fetch --quiet origin "$HEAD_SHA"
          APP_SHA=$(bash scripts/app-content-sha.sh "$HEAD_SHA")
          echo "app_sha=${APP_SHA}" >> "$GITHUB_OUTPUT"
          echo "${HEAD_SHA} carries app content ${APP_SHA}."

      - name: Probe for an existing bundle
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APP_SHA: ${{ steps.sha.outputs.app_sha }}
        run: |
          set -euo pipefail

          live=$(gh api "repos/${REPO}/actions/artifacts?name=${APP_SHA}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')

          if [ "$live" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${APP_SHA} is already published — a release or another PR built this content."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Built here rather than in a workflow_run, so a pull request's own code only ever executes under
  # this unprivileged trigger. deploy-preview.yml waits on the artifact, which is what makes a green
  # test run a precondition for a preview.
  bundle:
    name: Build Preview Bundle
    needs: identity
    if: needs.identity.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-bundle

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.identity.outputs.app_sha }}
          path: bundle.tgz
          if-no-files-found: error
          retention-days: 14
