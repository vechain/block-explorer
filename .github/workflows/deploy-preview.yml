name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  TERRAFORM_VERSION: 1.6.0

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          IMAGE_TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.uri }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.block-explorer-preview.vechain.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Post initial PR comment (Building)
        id: initial-comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const customDomain = `pr-${prNumber}.block-explorer-preview.vechain.org`;

            const body = `## Block Explorer – block-explorer-preview

            | Name | Status | Preview | Updated (UTC) |
            |------|--------|---------|---------------|
            | **block-explorer-preview** | 🔨 Building ([${commitSha}](${commitUrl})) | Deploying... | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

            ---
            <sub>Built with commit ${commitSha} • Preview environments are automatically destroyed when PRs are closed</sub>`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Block Explorer – block-explorer-preview')
            );

            let commentId;
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
              commentId = existingComment.id;
            } else {
              // Create new comment
              const comment = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              commentId = comment.data.id;
            }

            return commentId;

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create preview environment config
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          WORKSPACE_NAME="preview-pr-${PR_NUMBER}"

          # Create workspace directory if it doesn't exist
          mkdir -p "terraform/environments/${WORKSPACE_NAME}"

          # Copy and customize the preview config
          cp terraform/environments/preview/preview.yaml.example "terraform/environments/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

          # Replace placeholders with actual values
          sed -i "s/{PR_NUMBER}/${PR_NUMBER}/g" "terraform/environments/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"
          sed -i "s/{COMMIT_SHA}/${SHORT_SHA}/g" "terraform/environments/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

          # Show the config for debugging
          echo "Generated config:"
          cat "terraform/environments/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

      - name: Terraform Init
        working-directory: terraform/frontend
        run: |
          terraform init -backend-config=../environments/preview/backend.config

      - name: Terraform Workspace
        working-directory: terraform/frontend
        run: |
          WORKSPACE_NAME="preview-pr-${{ github.event.pull_request.number }}"
          terraform workspace select ${WORKSPACE_NAME} || terraform workspace new ${WORKSPACE_NAME}

      - name: Terraform Plan
        working-directory: terraform/frontend
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/frontend
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment URL
        working-directory: terraform/frontend
        id: outputs
        run: |
          CUSTOM_URL=$(terraform output -raw custom_domain_url || echo "")
          SERVICE_URL=$(terraform output -raw service_url || echo "")
          DOMAIN_STATUS=$(terraform output -raw custom_domain_status || echo "unknown")
          echo "custom_url=${CUSTOM_URL}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "custom_domain_status=${DOMAIN_STATUS}" >> $GITHUB_OUTPUT

      - name: Update PR comment (Ready)
        uses: actions/github-script@v7
        with:
          script: |
            const customUrl = '${{ steps.outputs.outputs.custom_url }}';
            const serviceUrl = '${{ steps.outputs.outputs.service_url }}';
            const domainStatus = '${{ steps.outputs.outputs.custom_domain_status }}';
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const customDomain = `pr-${prNumber}.block-explorer-preview.vechain.org`;

            let previewLinks = `[Custom Domain →](${customUrl}) • [App Runner URL →](${serviceUrl})`;
            const statusNote = '\n\n> ⏱️ **Note:** Custom domain may take 5-10 minutes to activate on first deployment. Use App Runner URL in the meantime.';

            const body = `## Block Explorer – block-explorer-preview

            | Name | Status | Preview | Updated (UTC) |
            |------|--------|---------|---------------|
            | **block-explorer-preview** | ✅ Ready ([${commitSha}](${commitUrl})) | ${previewLinks} | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |
            ${statusNote}

            ---
            <sub>Built with commit ${commitSha} • Preview environments are automatically destroyed when PRs are closed</sub>`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Block Explorer – block-explorer-preview')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment (shouldn't happen, but just in case)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

      - name: Update PR comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `## Block Explorer – block-explorer-preview

            | Name | Status | Preview | Updated (UTC) |
            |------|--------|---------|---------------|
            | **block-explorer-preview** | ❌ Failed ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

            ---
            <sub>Build failed for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Block Explorer – block-explorer-preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            }

      - name: Deployment summary
        if: success()
        run: |
          echo "### Preview Environment Deployed! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.outputs.outputs.custom_url }}" ]; then
            echo "**Custom Domain:** ${{ steps.outputs.outputs.custom_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Service URL:** ${{ steps.outputs.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
