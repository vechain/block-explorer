name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # AWS Configuration
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  TERRAFORM_VERSION: 1.6.0

  # Project Configuration
  PROJECT_NAME: block-explorer
  PREVIEW_DOMAIN_SUFFIX: block-explorer-preview.vechain.org

  # Terraform Paths
  TERRAFORM_DIR: terraform/frontend
  TERRAFORM_ENV_DIR: terraform/environments
  TERRAFORM_BACKEND_CONFIG: ../environments/preview/backend.config

jobs:
  pr-comment:
    name: Post Initial PR Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
    
    steps:
      - name: Post initial PR comment (Building)
        id: comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const projectName = process.env.PROJECT_NAME;

            const body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

            | Name | Status | Preview | Updated (UTC) |
            |------|--------|---------|---------------|
            | **${projectName}-preview** | 🔨 Building ([${commitSha}](${commitUrl})) | Building image... | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

            ---
            <sub>Building with commit ${commitSha} • Preview environments are automatically destroyed when PRs are closed</sub>`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes(`${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview`)
            );

            let commentId;
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
              commentId = existingComment.id;
            } else {
              // Create new comment
              const comment = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              commentId = comment.data.id;
            }
            
            console.log(`Comment ID: ${commentId}`);
            core.setOutput('comment_id', commentId);

  build-and-push:
    uses: ./.github/workflows/build-push-ecr.yml
    with:
      ecr_repository: block-explorer
      image_tag: pr-${{ github.event.pull_request.number }}
      aws_region: eu-west-1
    secrets:
      aws_role_arn: ${{ secrets.AWS_ACC_ROLE }}

  setup-preview-infra:
    name: Setup Preview Infrastructure
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event.action == 'opened'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create preview environment config
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          WORKSPACE_NAME="preview-pr-${PR_NUMBER}"

          # Create workspace directory if it doesn't exist
          mkdir -p "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}"

          # Copy and customize the preview config
          cp "${{ env.TERRAFORM_ENV_DIR }}/preview/preview.yaml.example" "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

          # Replace placeholders with actual values
          sed -i "s/{PR_NUMBER}/${PR_NUMBER}/g" "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

          # Show the config for debugging
          echo "Generated config:"
          cat "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init -backend-config=${{ env.TERRAFORM_BACKEND_CONFIG }}

      - name: Terraform Workspace
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          WORKSPACE_NAME="preview-pr-${{ github.event.pull_request.number }}"
          terraform workspace select ${WORKSPACE_NAME} || terraform workspace new ${WORKSPACE_NAME}

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform apply -auto-approve

  update-comment:
    name: Update PR Comment
    runs-on: ubuntu-latest
    needs: [pr-comment, build-and-push, setup-preview-infra]
    if: always() && needs.pr-comment.result == 'success'
    permissions:
      pull-requests: write
    
    steps:
      - name: Update PR comment with final status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const projectName = process.env.PROJECT_NAME;
            const domainSuffix = process.env.PREVIEW_DOMAIN_SUFFIX;
            const isFirstDeploy = '${{ github.event.action }}' === 'opened';
            
            const buildResult = '${{ needs.build-and-push.result }}';
            const infraResult = '${{ needs.setup-preview-infra.result }}';
            
            let body;
            
            if (buildResult === 'failure') {
              // Build failed
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ❌ Build Failed ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>Docker build failed for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;
            } else if (isFirstDeploy && infraResult === 'failure') {
              // Infrastructure setup failed
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ❌ Setup Failed ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>Infrastructure setup failed for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;
            } else if (buildResult === 'success') {
              // Build succeeded
              const customUrl = `https://pr-${prNumber}.${domainSuffix}`;
              const status = isFirstDeploy ? '🚀 Deploying' : '🚀 Deploying';
              const message = isFirstDeploy 
                ? `Initial deployment in progress • App Runner service being created • Ready in ~3-5 minutes`
                : `Image built with commit ${commitSha} • App Runner will auto-deploy in ~2-3 minutes`;
              
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ${status} ([${commitSha}](${commitUrl})) | [Preview URL →](${customUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>${message} • Preview environments are destroyed when PRs are closed</sub>`;
            } else {
              // Unexpected state
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ⚠️ Unknown Status ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>Unexpected workflow state for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;
            }

            // Find and update existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes(`${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview`)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            }

      - name: Build summary
        if: needs.build-and-push.result == 'success'
        run: |
          if [ "${{ github.event.action }}" = "opened" ]; then
            echo "### Preview Environment Created! 🎉" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
            echo "**Image Tag:** \`${{ needs.build-and-push.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Preview URL:** https://pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_DOMAIN_SUFFIX }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 App Runner service created and deploying (ready in ~3-5 minutes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Preview Image Built! 🎉" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
            echo "**Image Tag:** \`${{ needs.build-and-push.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Preview URL:** https://pr-${{ github.event.pull_request.number }}.${{ env.PREVIEW_DOMAIN_SUFFIX }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 App Runner will automatically deploy this image in ~2-3 minutes" >> $GITHUB_STEP_SUMMARY
          fi
