name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  GHCR_REGISTRY: ghcr.io
  TERRAFORM_VERSION: 1.16.0
  TERRAFORM_DIR: terraform/frontend-preview
  TERRAFORM_BACKEND_CONFIG: ../environments/preview/backend.config

jobs:
  # The `create-preview` label is the approval; one-way, with teardown still on PR close.
  gate:
    name: Preview deploy gate
    runs-on: ubuntu-latest
    # A `labeled` event fires for any label, hence the last clause.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'create-preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'create-preview')
    steps:
      - name: Confirm gate
        run: echo "Preview deploy gate passed"

  announce:
    name: Post Initial PR Comment
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — deploying

            Building `${{ github.event.pull_request.head.sha }}`. [Follow along →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # Promoted, not rebuilt: previews run the arm64 image dev and prod run.
  image:
    name: Promote PR Image to ECR
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      id-token: write
      contents: read
      packages: read
    environment:
      name: preview
    outputs:
      ecr_tag: ${{ steps.meta.outputs.ecr_tag }}
    steps:
      # Base, not the PR head: this job assumes a role, so the script it runs
      # must not be one the PR can edit.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tags
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${HEAD_SHA}^{commit}" >/dev/null 2>&1 \
            || git fetch --quiet origin "$HEAD_SHA"
          APP_SHA=$(bash scripts/app-content-sha.sh "$HEAD_SHA")
          SHORT_SHA="${HEAD_SHA:0:7}"
          {
            echo "ghcr_wait_tag=pr.${PR_NUMBER}.${SHORT_SHA}"
            echo "ghcr_tag=pr.${PR_NUMBER}.${APP_SHA}"
            echo "ecr_tag=pr-${PR_NUMBER}-${APP_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "PR #${PR_NUMBER} at ${HEAD_SHA} carries app content ${APP_SHA}."

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Long window because a `labeled` event can arrive while the unit tests
      # and the image build are still running on that commit.
      - name: Wait for the PR image
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.ghcr_wait_tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1; then
              echo "${GHCR_IMAGE} is published."
              exit 0
            fi
            echo "Attempt ${attempt}/40: not published yet, retrying in 30s..."
            sleep 30
          done
          echo "::error::${GHCR_IMAGE} never appeared. The unit tests for this commit have to pass before a preview can deploy."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Copies the manifest list rather than one platform, so the arm64 task can
      # resolve its own architecture.
      - name: Copy manifest list from GHCR to ECR
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.ghcr_tag }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.ecr_tag }}
          ECR_TAG: ${{ steps.meta.outputs.ecr_tag }}
        run: |
          set -euo pipefail

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids "imageTag=${ECR_TAG}" --no-cli-pager >/dev/null 2>&1; then
            echo "${ECR_TAG} is already in ECR — this push changed nothing the build reads."
            exit 0
          fi

          docker buildx imagetools create -t "$ECR_IMAGE" "$GHCR_IMAGE"
          docker buildx imagetools inspect "$ECR_IMAGE"

  deploy:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    needs: [gate, image]
    permissions:
      id-token: write
      contents: read
    # Shared, never per-PR: nothing in a workflow can delete an environment. See workflows/README.md.
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.block-explorer-preview.vechain.org
    outputs:
      url: ${{ steps.outputs.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Terraform owns the task definition here, so the apply is what rolls the service.
      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: ${{ needs.image.outputs.ecr_tag }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="${TERRAFORM_BACKEND_CONFIG}"
          terraform workspace select -or-create "pr-${PR_NUMBER}"
          terraform plan -input=false -out=tfplan \
            -var="pr_number=${PR_NUMBER}" -var="image_tag=${IMAGE_TAG}"
          terraform apply -input=false -auto-approve tfplan

      - name: Read outputs
        id: outputs
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          set -euo pipefail
          {
            echo "url=$(terraform output -raw url)"
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "service=$(terraform output -raw service_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the service
        env:
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Confirm the preview is serving
        env:
          URL: ${{ steps.outputs.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "${URL}/api/health returned 200."
              exit 0
            fi
            echo "Attempt ${attempt}/10: got '${code}', retrying in 15s..."
            sleep 15
          done
          echo "::error::${URL}/api/health never returned 200."
          exit 1

      # Without it every indexer call leaves from dev's one NAT IP and takes its rate limit.
      - name: Warn if the indexer bypass token is missing
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          set -euo pipefail
          if [ "$(terraform output -raw indexer_bypass_attached)" != "true" ]; then
            echo "::warning::No indexer rate-limit bypass token is attached; expect 429s from the indexer."
          fi

  comment:
    name: Update PR Comment
    runs-on: ubuntu-latest
    needs: [gate, image, deploy]
    # `always()` disables the implicit skip, so the gate has to be re-checked here.
    if: always() && needs.gate.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - name: Report success
        if: needs.deploy.result == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — ready

            ${{ needs.deploy.outputs.url }}

            <sub>Commit `${{ github.event.pull_request.head.sha }}`. Torn down when this PR closes.</sub>

      - name: Report failure
        if: needs.deploy.result != 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — failed

            Commit `${{ github.event.pull_request.head.sha }}` did not deploy. [View logs →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
