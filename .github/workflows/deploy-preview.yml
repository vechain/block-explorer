name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # AWS Configuration
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  TERRAFORM_VERSION: 1.10.0

  # Project Configuration
  PROJECT_NAME: block-explorer
  PREVIEW_DOMAIN_SUFFIX: block-explorer-preview.vechain.org

  # Terraform Paths
  TERRAFORM_DIR: terraform/frontend
  TERRAFORM_ENV_DIR: terraform/environments
  TERRAFORM_BACKEND_CONFIG: ../environments/preview/backend.config

jobs:
  # The preview deploy is gated by exactly one of `gate-auto` or
  # `gate-approval`. Routing is decided in `classify`, which checks the
  # PR author against the repository's collaborators API — this is the
  # authoritative way to recognize org members with write access. We do
  # not rely on `github.event.pull_request.author_association` because
  # that field can return CONTRIBUTOR for confirmed org members,
  # depending on how the org/team membership is exposed at webhook time.
  #
  # Dependabot PRs cannot access AWS secrets and would always fail, so
  # they short-circuit `classify` and skip both gates entirely.

  classify:
    name: Classify PR author
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    outputs:
      auto: ${{ steps.check.outputs.auto }}
    steps:
      - name: Decide auto vs approval
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Fork PR — routing to approval"
            echo "auto=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTHOR" = "renovate[bot]" ]; then
            echo "Renovate PR — routing to approval (opt-in)"
            echo "auto=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # In-repo human PR: GitHub already enforced that the author has
          # push access to land a branch on this repo, so the author is
          # trusted to deploy a preview without an additional review.
          echo "In-repo human PR — routing to auto"
          echo "auto=true" >> "$GITHUB_OUTPUT"

  gate-auto:
    # Collaborators (org members with write access + outside
    # collaborators) deploy without human review via the no-rules
    # `preview-auto` environment.
    name: Auto-approve preview deploy (collaborator)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.auto == 'true'
    environment:
      name: preview-auto
    steps:
      - name: Record auto-approval
        run: echo "Auto-approved for ${{ github.event.pull_request.user.login }}"

  gate-approval:
    # Everyone else — Renovate, external contributors, fork PRs — lands
    # in `preview-approval`, which has required reviewers and pauses
    # the workflow until a reviewer with write access clicks "Approve
    # and deploy".
    name: Require approval for preview deploy
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.auto == 'false'
    environment:
      name: preview-approval
    steps:
      - name: Record reviewer approval
        run: echo "Reviewer-approved for ${{ github.event.pull_request.user.login }}"

  gate:
    # Single downstream entry point. Succeeds when either gate above
    # succeeded; skipped when classify itself was skipped (Dependabot).
    name: Preview deploy gate
    runs-on: ubuntu-latest
    needs: [gate-auto, gate-approval]
    if: >-
      !cancelled() && !failure() &&
      (needs.gate-auto.result == 'success' || needs.gate-approval.result == 'success')
    steps:
      - name: Confirm gate
        run: echo "Preview deploy gate passed"

  pr-comment:
    name: Post Initial PR Comment
    runs-on: ubuntu-latest
    needs: [gate]
    # The `!cancelled() && !failure() &&` prefix is required to opt out
    # of GitHub Actions' implicit `success()` check: when one of `gate`'s
    # transitive ancestors (`gate-auto` or `gate-approval`) is skipped,
    # the skip cascades to every downstream job even when `gate` itself
    # ran successfully and we provide an explicit `if:`. Mirroring the
    # gate's own prefix here breaks that cascade.
    if: >-
      !cancelled() && !failure() &&
      needs.gate.result == 'success'
    permissions:
      pull-requests: write
    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}

    steps:
      - name: Post initial PR comment (Building)
        id: comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const projectName = process.env.PROJECT_NAME;

            const body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

            | Name | Status | Preview | Updated (UTC) |
            |------|--------|---------|---------------|
            | **${projectName}-preview** | 🔨 Building ([${commitSha}](${commitUrl})) | Building image... | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

            ---
            <sub>Building with commit ${commitSha} • Preview environments are automatically destroyed when PRs are closed</sub>`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes(`${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview`)
            );

            let commentId;
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
              commentId = existingComment.id;
            } else {
              // Create new comment
              const comment = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              commentId = comment.data.id;
            }

            console.log(`Comment ID: ${commentId}`);
            core.setOutput('comment_id', commentId);

  prepare-metadata:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    needs: [gate]
    if: >-
      !cancelled() && !failure() &&
      needs.gate.result == 'success'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Generate metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          IMAGE_TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: [gate, prepare-metadata]
    if: >-
      !cancelled() && !failure() &&
      needs.gate.result == 'success' &&
      needs.prepare-metadata.result == 'success'
    uses: ./.github/workflows/build-push-ecr.yml
    with:
      ecr_repository: block-explorer
      image_tag: ${{ needs.prepare-metadata.outputs.image_tag }}
      aws_region: eu-west-1
      environment_name: preview-pr-${{ github.event.pull_request.number }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ACC_ROLE }}

  deploy:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    needs: [gate, prepare-metadata, build-and-push]
    if: >-
      !cancelled() && !failure() &&
      needs.gate.result == 'success' &&
      needs.prepare-metadata.result == 'success' &&
      needs.build-and-push.result == 'success'
    permissions:
      id-token: write
      contents: read
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.block-explorer-preview.vechain.org

    outputs:
      custom_url: ${{ steps.outputs.outputs.custom_url }}
      service_url: ${{ steps.outputs.outputs.service_url }}
      custom_domain_status: ${{ steps.outputs.outputs.custom_domain_status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create preview environment config
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          SHORT_SHA=${{ needs.prepare-metadata.outputs.short_sha }}
          WORKSPACE_NAME="preview-pr-${PR_NUMBER}"

          # Create workspace directory if it doesn't exist
          mkdir -p "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}"

          # Copy and customize the preview config
          cp "${{ env.TERRAFORM_ENV_DIR }}/preview/preview.yaml.example" "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

          # Replace placeholders with actual values
          sed -i "s/{PR_NUMBER}/${PR_NUMBER}/g" "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"
          sed -i "s/{COMMIT_SHA}/${SHORT_SHA}/g" "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

          # Show the config for debugging
          echo "Generated config:"
          cat "${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}/${WORKSPACE_NAME}.yaml"

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init -backend-config=${{ env.TERRAFORM_BACKEND_CONFIG }}

      - name: Terraform Workspace
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          WORKSPACE_NAME="preview-pr-${{ github.event.pull_request.number }}"
          terraform workspace select ${WORKSPACE_NAME} || terraform workspace new ${WORKSPACE_NAME}

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment URL
        working-directory: ${{ env.TERRAFORM_DIR }}
        id: outputs
        run: |
          CUSTOM_URL=$(terraform output -raw custom_domain_url || echo "")
          SERVICE_URL=$(terraform output -raw service_url || echo "")
          DOMAIN_STATUS=$(terraform output -raw custom_domain_status || echo "unknown")
          echo "custom_url=${CUSTOM_URL}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "custom_domain_status=${DOMAIN_STATUS}" >> $GITHUB_OUTPUT

  update-comment:
    name: Update PR Comment
    runs-on: ubuntu-latest
    needs: [pr-comment, prepare-metadata, build-and-push, deploy]
    if: always() && needs.pr-comment.result == 'success'
    permissions:
      pull-requests: write

    steps:
      - name: Update PR comment with final status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const projectName = process.env.PROJECT_NAME;

            const buildResult = '${{ needs.build-and-push.result }}';
            const deployResult = '${{ needs.deploy.result }}';

            let body;

            if (buildResult === 'failure') {
              // Build failed
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ❌ Build Failed ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>Docker build failed for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;
            } else if (deployResult === 'failure') {
              // Deploy failed
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ❌ Deployment Failed ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>Deployment failed for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;
            } else if (deployResult === 'success') {
              // Success - get deployment URLs from deploy job outputs
              const customUrl = '${{ needs.deploy.outputs.custom_url }}';
              const serviceUrl = '${{ needs.deploy.outputs.service_url }}';
              
              let previewLinks = `[Custom Domain →](${customUrl})  • [Default URL →](${serviceUrl})`;
              let statusNote = '\n\n> ⏱️ **Note:** Custom domain may take 5-10 minutes to activate on first deployment. Use Default URL in the meantime.';
              
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ✅ Ready ([${commitSha}](${commitUrl})) | ${previewLinks} | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |
              ${statusNote}

              ---
              <sub>Built with commit ${commitSha} • Preview environments are automatically destroyed when PRs are closed</sub>`;
            } else {
              // Unexpected state
              body = `## ${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview

              | Name | Status | Preview | Updated (UTC) |
              |------|--------|---------|---------------|
              | **${projectName}-preview** | ⚠️ Unknown Status ([${commitSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${new Date().toISOString().replace('T', ' ').substring(0, 19)} |

              ---
              <sub>Unexpected workflow state for commit ${commitSha} • [Check logs](${runUrl}) for details</sub>`;
            }

            // Find and update existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes(`${projectName.charAt(0).toUpperCase() + projectName.slice(1).replace(/-/g, ' ')} – Preview`)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            }

      - name: Deployment summary
        if: needs.deploy.result == 'success'
        run: |
          echo "### Preview Environment Deployed! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.deploy.outputs.custom_url }}" ]; then
            echo "**Custom Domain:** ${{ needs.deploy.outputs.custom_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Service URL:** ${{ needs.deploy.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
