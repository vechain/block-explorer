name: Destroy Preview Environment

on:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  destroy:
    name: Destroy Preview Environment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # Only run if the PR was actually deployed (has the environment)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/frontend
        run: |
          terraform init -backend-config=../environments/preview/backend.config

      - name: Terraform Workspace Select
        working-directory: terraform/frontend
        id: workspace
        continue-on-error: true
        run: |
          WORKSPACE_NAME="preview-pr-${{ github.event.pull_request.number }}"
          terraform workspace select ${WORKSPACE_NAME}
          echo "exists=true" >> $GITHUB_OUTPUT

      - name: Terraform Destroy
        if: steps.workspace.outputs.exists == 'true'
        working-directory: terraform/frontend
        run: |
          terraform destroy -auto-approve

      - name: Delete Terraform Workspace
        if: steps.workspace.outputs.exists == 'true'
        working-directory: terraform/frontend
        run: |
          WORKSPACE_NAME="preview-pr-${{ github.event.pull_request.number }}"
          terraform workspace select default
          terraform workspace delete ${WORKSPACE_NAME}

      - name: Clean up environment config
        if: steps.workspace.outputs.exists == 'true'
        run: |
          WORKSPACE_NAME="preview-pr-${{ github.event.pull_request.number }}"
          rm -rf "terraform/environments/${WORKSPACE_NAME}"

      - name: Comment on PR
        if: steps.workspace.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            
            const body = `## 🗑️ Preview Environment Destroyed
            
            The preview environment for this PR has been cleaned up.
            
            ### Details
            - **PR:** #${prNumber}
            - **Workspace:** \`preview-pr-${prNumber}\`
            - **Status:** Destroyed
            
            ---
            <sub>Destroyed via GitHub Actions</sub>`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Destruction summary
        if: steps.workspace.outputs.exists == 'true'
        run: |
          echo "### Preview Environment Destroyed! 🗑️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workspace:** \`preview-pr-${{ github.event.pull_request.number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All resources have been cleaned up." >> $GITHUB_STEP_SUMMARY

      - name: No workspace found
        if: steps.workspace.outputs.exists != 'true'
        run: |
          echo "### No Preview Environment Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No workspace found for PR #${{ github.event.pull_request.number }}. Nothing to destroy." >> $GITHUB_STEP_SUMMARY

