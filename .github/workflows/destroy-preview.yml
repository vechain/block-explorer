name: Destroy Preview Environment

# A preview owns its routing-store key and its runtime-config.json, nothing else. The bundle stays:
# it is content-addressed and shared with dev and with any other PR on the same content.

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Shared with deploy-preview, and never cancelling: an incoming deploy must not cancel a teardown.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.16.0
  CDN_DIR: terraform/cdn
  CDN_BACKEND_CONFIG: ../environments/dev/backend.config

jobs:
  destroy:
    name: Destroy Preview Environment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # Forks and unlabelled PRs have no preview; the delete below is a no-op for them.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Read the CDN outputs
        id: cdn
        working-directory: ${{ env.CDN_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="${CDN_BACKEND_CONFIG}"
          terraform workspace select dev
          {
            echo "bucket=$(terraform output -raw bucket_name)"
            echo "kvs_arn=$(terraform output -raw key_value_store_arn)"
          } >> "$GITHUB_OUTPUT"

      # The key first: it is what makes the host answer, so deleting it is the teardown even if the
      # config delete below fails and the sweep has to finish the job.
      - name: Delete the preview
        id: delete
        env:
          BUCKET: ${{ steps.cdn.outputs.bucket }}
          KVS_ARN: ${{ steps.cdn.outputs.kvs_arn }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          host="pr-${PR_NUMBER}.block-explorer-preview.vechain.org"

          if ! aws cloudfront-keyvaluestore get-key --kvs-arn "$KVS_ARN" --key "$host" \
               --no-cli-pager >/dev/null 2>&1; then
            echo "No preview for PR #${PR_NUMBER}; nothing to destroy."
            echo "existed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          etag=$(aws cloudfront-keyvaluestore describe-key-value-store --kvs-arn "$KVS_ARN" \
            --no-cli-pager --query ETag --output text)
          aws cloudfront-keyvaluestore delete-key --kvs-arn "$KVS_ARN" --if-match "$etag" \
            --key "$host" --no-cli-pager >/dev/null

          aws s3 rm "s3://${BUCKET}/pr-${PR_NUMBER}/" --recursive --only-show-errors

          echo "existed=true" >> "$GITHUB_OUTPUT"
          echo "${host} is gone."

      - name: Report teardown
        if: steps.delete.outputs.existed == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — torn down

            <sub>`pr-${{ github.event.pull_request.number }}` removed from the routing store.</sub>

      # Loud: the sweep retries within six hours, but a repeated failure needs a human.
      - name: Report a failed teardown
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — teardown FAILED

            `pr-${{ github.event.pull_request.number }}` is still routed. The reconcile sweep will retry within six hours. [View logs →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
