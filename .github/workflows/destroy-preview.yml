name: Destroy Preview Environment

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Shared with deploy-preview so a teardown cannot run against the Terraform state an
# in-flight deploy is holding. GitHub evaluates cancel-in-progress on the incoming run, so
# `true` would let a deploy cancel a teardown mid-destroy and strand the lock.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.16.0
  TERRAFORM_DIR: terraform/frontend-preview
  TERRAFORM_BACKEND_CONFIG: ../environments/preview/backend.config

jobs:
  destroy:
    name: Destroy Preview Environment
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # Forks and unlabelled PRs have no preview; the workspace select below exits.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Select the workspace
        id: workspace
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="${TERRAFORM_BACKEND_CONFIG}"
          if terraform workspace select "pr-${PR_NUMBER}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No workspace for PR #${PR_NUMBER}; nothing to destroy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # image_tag is required but irrelevant once the task definition is going away.
      - name: Terraform destroy
        if: steps.workspace.outputs.exists == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve \
            -var="pr_number=${PR_NUMBER}" -var="image_tag=destroy"

      - name: Delete the workspace
        if: steps.workspace.outputs.exists == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          terraform workspace select default
          terraform workspace delete "pr-${PR_NUMBER}"

      - name: Report teardown
        if: steps.workspace.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — torn down

            <sub>Workspace `pr-${{ github.event.pull_request.number }}` destroyed.</sub>

      # Loud on failure: the workspace stays in the list, so preview-reconcile
      # retries within six hours, but a repeated failure needs a human.
      - name: Report a failed teardown
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            ### Preview — teardown FAILED

            Workspace `pr-${{ github.event.pull_request.number }}` still exists. The reconcile sweep will retry within six hours. [View logs →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
