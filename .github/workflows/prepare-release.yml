name: Prepare release draft

# Called by deploy.yml, which is itself workflow_run-triggered — see workflows/README.md.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-release-draft
  cancel-in-progress: false

jobs:
  prepare:
    name: Refresh draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh` walks up looking for a .git to infer the repo, and there is no checkout.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Skip if already published
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "$TAG is already published — nothing to do."
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      # GitHub's default baseline is the preceding tag, which every merge to main
      # produces. Prereleases count: the prod deploy fires on any published
      # release, so the newest published one is what prod is actually running.
      - name: Resolve last published tag
        if: env.ALREADY_PUBLISHED != 'true'
        id: prev
        run: |
          set -euo pipefail
          prev=$(gh release list --exclude-drafts \
                   --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "Baseline: ${prev:-<none>}"

      # One draft at a time, so there is exactly one publish button. Restricted to
      # the version-tag namespace: a hand-made draft on another name is left alone.
      - name: Delete stale version drafts
        if: env.ALREADY_PUBLISHED != 'true'
        run: |
          set -euo pipefail
          mapfile -t drafts < <(gh release list --limit 50 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | select(.tagName | test("^v\\.")) | .tagName')
          for draft in "${drafts[@]:-}"; do
            [ -z "$draft" ] && continue
            echo "Deleting stale draft: $draft"
            gh release delete "$draft" --yes
          done

      - name: Create draft
        if: env.ALREADY_PUBLISHED != 'true'
        env:
          PREVIOUS: ${{ steps.prev.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--draft --title "$TAG" --generate-notes)
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$TAG" "${args[@]}"
          echo "Draft \`$TAG\` ready to publish (notes from ${PREVIOUS:-the first commit})." >> "$GITHUB_STEP_SUMMARY"
