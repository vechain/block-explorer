name: Deploy to Prod

# Publishing the draft release deploy-dev.yml left is what promotes to prod.
on:
  release:
    types: [published]
  # Break-glass. Run it against a tag, not a branch — see the guard below.
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  TERRAFORM_VERSION: 1.16.0
  GHCR_REGISTRY: ghcr.io

jobs:
  # A release can be published on a tag pointing anywhere, so this refuses
  # anything not reachable from main. No job below takes a `ref:` from event data:
  # every one of them checks out the ref the run started on, which this has
  # already vouched for — and which is why a branch is refused outright.
  guard:
    name: Resolve and Verify Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ghcr_tag: ${{ steps.resolve.outputs.ghcr_tag }}
      app_sha: ${{ steps.content.outputs.app_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The credentialed jobs run whatever Terraform is in the tree they check
          # out, and a branch moves under them. Prod deploys from a tag only.
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Started on '${GITHUB_REF}'. Deploy prod from a tag, not a branch."
            exit 1
          fi

          # Anchored, so v.1.2.3junk is not a version. The optional suffix is for
          # prereleases, which deploy prod like any other published release.
          if [[ ! "$RAW_TAG" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version tag: '$RAW_TAG'. Expected v.X.Y.Z."
            exit 1
          fi

          # GHCR strips the v. prefix. This account's registry holds nothing but
          # releases, so ECR keeps the tag as it is.
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr_tag=${RAW_TAG#v.}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is reachable from main
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main
          SHA=$(git rev-list -n 1 "refs/tags/${TAG}")

          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${TAG} ($SHA) is not an ancestor of origin/main. Refusing to deploy unreviewed code."
            exit 1
          fi
          echo "${TAG} -> ${SHA}, reachable from main."

      # At the tag, not at HEAD: a merge landing mid-deploy must not move it.
      - name: Resolve the content SHA
        id: content
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          APP_SHA=$(bash scripts/app-content-sha.sh "refs/tags/${TAG}")
          echo "app_sha=${APP_SHA}" >> "$GITHUB_OUTPUT"
          echo "${TAG} carries app content ${APP_SHA}."

  # The manifest list, not one platform: the tasks are arm64.
  promote:
    name: Promote Image to ECR
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write
      contents: read
      packages: read
    environment:
      name: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on one manifest, each written only if absent — the repo is immutable.
      - name: Copy manifest list from GHCR to ECR
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:${{ needs.guard.outputs.ghcr_tag }}
          ECR_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ needs.guard.outputs.tag }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
        run: |
          set -euo pipefail

          present() {
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$1" --no-cli-pager >/dev/null 2>&1
          }

          if present "$APP_SHA" && present "$TAG"; then
            echo "${APP_SHA} and ${TAG} are both already in ECR."
            exit 0
          fi

          for attempt in $(seq 1 6); do
            if docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::${GHCR_IMAGE} never appeared."
              exit 1
            fi
            echo "Attempt ${attempt}/6: ${GHCR_IMAGE} not published yet, retrying in 10s..."
            sleep 10
          done

          # Source is the GHCR version tag either way: on a reused build it is
          # already an alias of the same manifest the content tag points at.
          for tag in "$APP_SHA" "$TAG"; do
            if present "$tag"; then
              echo "${tag} is already in ECR."
              continue
            fi
            docker buildx imagetools create -t "${ECR_REPO}:${tag}" "$GHCR_IMAGE"
          done

          docker buildx imagetools inspect "${ECR_REPO}:${APP_SHA}"

  # Same stacks and the same serial order as dev, less the two that only exist
  # there: previews live in the dev account, and so does the zone role dns/ owns.
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs: [guard, promote]
    permissions:
      id-token: write
      contents: read
    environment:
      name: prod
    outputs:
      cluster: ${{ steps.outputs.outputs.cluster }}
      service: ${{ steps.outputs.outputs.service }}
      family: ${{ steps.outputs.outputs.family }}
      taskdef: ${{ steps.outputs.outputs.taskdef }}
      domain: ${{ steps.outputs.outputs.domain }}
      alb: ${{ steps.outputs.outputs.alb }}
      grafana_url: ${{ steps.outputs.outputs.grafana_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Pinned to the image, not to this release: a release that changed nothing the
      # app reads then registers no revision, and the footer keeps the release that
      # last changed the app.
      - name: Pin the image tag and version
        env:
          IMAGE_TAG: ${{ needs.guard.outputs.app_sha }}
          VERSION_TAG: ${{ needs.guard.outputs.tag }}
          FAMILY: block-explorer-prod-frontend
        run: |
          set -euo pipefail

          running=$(aws ecs describe-task-definition --task-definition "$FAMILY" --no-cli-pager \
            --query "taskDefinition.containerDefinitions[?name=='frontend'] | [0]" --output json 2>/dev/null || true)

          app_version="$VERSION_TAG"
          if [ -n "${running:-}" ] && [ "$running" != "null" ]; then
            running_image=$(jq -r '.image // empty' <<<"$running")
            running_version=$(jq -r '.environment[]? | select(.name == "APP_VERSION") | .value' <<<"$running")
            if [ "${running_image##*:}" = "$IMAGE_TAG" ] && [ -n "$running_version" ]; then
              app_version="$running_version"
              echo "${IMAGE_TAG} already serves ${app_version}; keeping it."
            fi
          fi

          cd terraform/environments/prod
          sed -i "s|^image_tag:.*|image_tag: ${IMAGE_TAG}|" prod.yaml
          sed -i "s|^app_version:.*|app_version: ${app_version}|" prod.yaml
          grep -E '^(image_tag|app_version):' prod.yaml

      - name: Plan and apply each stack
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          # The public zones are in the dev account, so acm/ and edge/ reach
          # Route53 by assuming the role dns/ owns there.
          TF_VAR_dns_role_arn: ${{ vars.DNS_WRITER_ROLE_ARN }}
        run: |
          set -euo pipefail

          for stack in network ecs acm edge data observability-aws frontend observability-grafana; do
            echo "::group::${stack}"
            pushd "terraform/${stack}" >/dev/null

            terraform init -input=false -backend-config=../environments/prod/backend.config
            terraform workspace select -or-create prod

            # Plan file never leaves this job: a binary plan can carry state.
            terraform plan -input=false -out=tfplan
            terraform apply -input=false -auto-approve tfplan

            popd >/dev/null
            echo "::endgroup::"
          done

      - name: Read service outputs
        id: outputs
        run: |
          set -euo pipefail

          pushd terraform/frontend >/dev/null
          {
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "service=$(terraform output -raw service_name)"
            echo "family=$(terraform output -raw task_definition_family)"
            echo "taskdef=$(terraform output -raw task_definition_arn)"
          } >> "$GITHUB_OUTPUT"
          popd >/dev/null

          pushd terraform/edge >/dev/null
          {
            echo "domain=$(terraform output -raw url)"
            echo "alb=$(terraform output -raw alb_dns_name)"
          } >> "$GITHUB_OUTPUT"
          popd >/dev/null

          pushd terraform/observability-grafana >/dev/null
          echo "grafana_url=$(terraform output -raw amg_workspace_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          popd >/dev/null

  # Terraform registered a new task definition revision but the service pins its
  # own, because the frontend stack ignores task_definition changes. Passing the
  # family is what moves the pointer - without it, --force-new-deployment just
  # redeploys the frozen one.
  roll:
    name: Roll ECS Service
    runs-on: ubuntu-latest
    needs: [guard, terraform]
    permissions:
      id-token: write
      contents: read
    environment:
      name: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      # The revision rather than the image tag, so a cpu, memory, env or sidecar
      # change that leaves the image alone still rolls.
      - name: Check whether a roll is needed
        id: needed
        env:
          CLUSTER: ${{ needs.terraform.outputs.cluster }}
          SERVICE: ${{ needs.terraform.outputs.service }}
          DESIRED: ${{ needs.terraform.outputs.taskdef }}
        run: |
          set -euo pipefail

          running=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --no-cli-pager --query 'services[0].taskDefinition' --output text)

          if [ "$running" = "$DESIRED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on ${running} — nothing to roll."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running ${running}, rolling to ${DESIRED}."
          fi

      - name: Deploy the new revision
        if: steps.needed.outputs.skip == 'false'
        env:
          CLUSTER: ${{ needs.terraform.outputs.cluster }}
          SERVICE: ${{ needs.terraform.outputs.service }}
          FAMILY: ${{ needs.terraform.outputs.family }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$FAMILY" \
            --force-new-deployment \
            --no-cli-pager \
            --query 'service.taskDefinition' --output text

          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      # By ALB name, not DNS, so no cached answer can pass the check.
      - name: Confirm the new stack is serving
        env:
          DOMAIN: ${{ needs.terraform.outputs.domain }}
          ALB: ${{ needs.terraform.outputs.alb }}
        run: |
          set -euo pipefail

          host="${DOMAIN#https://}"
          via=("--connect-to" "${host}:443:${ALB}:443")

          for attempt in $(seq 1 20); do
            code=$(curl "${via[@]}" -s -o /dev/null -w '%{http_code}' "https://${host}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "${ALB} answers /api/health with 200 for ${host}."
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "::error::${ALB} never returned 200 for https://${host}/api/health."
              exit 1
            fi
            echo "Attempt ${attempt}/20: got '${code}', retrying in 15s..."
            sleep 15
          done

          code=$(curl "${via[@]}" -s -o /dev/null -w '%{http_code}' "https://${host}/api/metrics" || true)
          if [ "$code" != "403" ]; then
            echo "::error::/api/metrics returned '${code}' on the ALB, expected 403."
            exit 1
          fi
          echo "/api/metrics is closed at the ALB."

      - name: Summary
        env:
          SERVICE: ${{ needs.terraform.outputs.service }}
          DOMAIN: ${{ needs.terraform.outputs.domain }}
          ALB: ${{ needs.terraform.outputs.alb }}
          GRAFANA_URL: ${{ needs.terraform.outputs.grafana_url }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
          SKIPPED: ${{ steps.needed.outputs.skip }}
        run: |
          {
            echo "### Prod deployed on ECS"
            echo
            echo "- Service: \`${SERVICE}\`"
            if [ "$SKIPPED" = "true" ]; then
              echo "- Roll **skipped** — already running \`${APP_SHA}\` with an unchanged task definition."
            else
              echo "- Rolled to \`${APP_SHA}\`."
            fi
            echo "- Serving on \`${ALB}\`, which ${DOMAIN} does not point at yet."
            if [ -n "$GRAFANA_URL" ]; then
              echo "- Grafana: ${GRAFANA_URL}/d/be-overview"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
