name: Deploy

# One workflow, both environments, target derived from the trigger:
#   bundle build finished → dev   (every merge to main gets a v.X.Y.Z tag)
#   release published     → prod  (the single draft the dev deploy left)
#   dispatch              → either, break-glass
# vars.AWS_OIDC_ROLE_ARN resolves per GitHub Environment and prod approval is a
# protection rule on the same object, so no job below branches on the target.
on:
  workflow_run:
    workflows: ["Build & Publish Release Bundle"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      version:
        description: "Version tag to deploy (e.g. v.1.0.0). Defaults to the ref when dispatched from a tag."
        required: false
        type: string

run-name: >-
  Deploy ${{ inputs.version || github.event.workflow_run.head_branch || github.ref_name }}
  → ${{ github.event_name == 'release' && 'prod' || (inputs.environment || 'dev') }}

# From the event, not from guard: concurrency is evaluated before any job runs.
concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || (inputs.environment || 'dev') }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.16.0

jobs:
  # A v.* tag can be pushed to any branch, hence the ancestor check.
  guard:
    name: Resolve Target and Verify Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      tag: ${{ steps.resolve.outputs.tag }}
      app_sha: ${{ steps.derive.outputs.app_sha }}
      stacks: ${{ steps.derive.outputs.stacks }}
      domain: ${{ steps.derive.outputs.domain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve target and tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          # workflow_run always starts on the default branch and carries the tag
          # name in head_branch; a release starts on the tag itself.
          DEV_TAG: ${{ inputs.version || github.event.workflow_run.head_branch }}
          PROD_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_run)      environment=dev ;;
            release)           environment=prod ;;
            workflow_dispatch) environment="$INPUT_ENV" ;;
            *) echo "::error::Unsupported event: ${EVENT_NAME}"; exit 1 ;;
          esac

          # The credentialed jobs run whatever Terraform is in the tree they check
          # out, so the ref they start on is part of the security model. Dev takes
          # main's tree with the tag's image; prod takes the tag's own tree, which
          # is why a branch is refused there outright.
          case "$environment" in
            dev)
              raw_tag="$DEV_TAG"
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::Started on '${GITHUB_REF}'. Dispatch a dev deploy from main — it applies whatever Terraform it checks out."
                exit 1
              fi
              ;;
            prod)
              raw_tag="$PROD_TAG"
              if [[ "$GITHUB_REF" != refs/tags/* ]]; then
                echo "::error::Started on '${GITHUB_REF}'. Deploy prod from a tag, not a branch."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown environment: '${environment}'"; exit 1 ;;
          esac

          if [ -z "$raw_tag" ]; then
            echo "::error::No version to deploy. Pass the 'version' input when dispatching a dev deploy."
            exit 1
          fi

          # Anchored, so v.1.2.3junk is not a version. The optional suffix is for
          # prereleases, which deploy like any other published release.
          if [[ ! "$raw_tag" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version tag: '${raw_tag}'. Expected v.X.Y.Z."
            exit 1
          fi

          {
            echo "environment=${environment}"
            echo "tag=${raw_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "${raw_tag} → ${environment}."

      - name: Verify the tag is reachable from main
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main
          SHA=$(git rev-list -n 1 "refs/tags/${TAG}")

          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${TAG} ($SHA) is not an ancestor of origin/main. Refusing to deploy unreviewed code."
            exit 1
          fi
          echo "${TAG} -> ${SHA}, reachable from main."

      # The content SHA is read at the tag, not at HEAD: a merge landing
      # mid-deploy must not move it.
      - name: Derive content SHA and environment names
        id: derive
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        run: |
          set -euo pipefail

          APP_SHA=$(bash scripts/app-content-sha.sh "refs/tags/${TAG}")

          case "$ENVIRONMENT" in
            dev)
              stacks="dns cdn observability-aws observability-grafana"
              ;;
            prod)
              stacks="cdn observability-aws observability-grafana"
              ;;
          esac

          domain=$(awk -F': *' '/^domain:/ {print $2; exit}' "terraform/environments/${ENVIRONMENT}/${ENVIRONMENT}.yaml")
          if [ -z "$domain" ]; then
            echo "::error::No domain in terraform/environments/${ENVIRONMENT}/${ENVIRONMENT}.yaml"
            exit 1
          fi

          {
            echo "app_sha=${APP_SHA}"
            echo "stacks=${stacks}"
            echo "domain=${domain}"
          } >> "$GITHUB_OUTPUT"
          echo "${TAG} carries app content ${APP_SHA}, deploying to ${domain}."

  # Serial, each stack planned immediately before its own apply — see workflows/README.md.
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.guard.outputs.environment }}
      url: https://${{ needs.guard.outputs.domain }}
    outputs:
      bucket: ${{ steps.outputs.outputs.bucket }}
      distribution: ${{ steps.outputs.outputs.distribution }}
      kvs_arn: ${{ steps.outputs.outputs.kvs_arn }}
      host_keys: ${{ steps.outputs.outputs.host_keys }}
      runtime_config: ${{ steps.outputs.outputs.runtime_config }}
      verify_url: ${{ steps.outputs.outputs.verify_url }}
      domain: ${{ steps.outputs.outputs.domain }}
      grafana_url: ${{ steps.outputs.outputs.grafana_url }}
    steps:
      # No `ref:` from event data: this job holds AWS credentials and Terraform runs the tree.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Both role vars pass unconditionally; the inapplicable one resolves to "".
      - name: Plan and apply each stack
        env:
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          STACKS: ${{ needs.guard.outputs.stacks }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_prod_deploy_role_arn: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          TF_VAR_dns_role_arn: ${{ vars.DNS_WRITER_ROLE_ARN }}
        run: |
          set -euo pipefail

          read -ra ordered <<<"$STACKS"
          for stack in "${ordered[@]}"; do
            echo "::group::${stack}"
            pushd "terraform/${stack}" >/dev/null

            terraform init -input=false -backend-config="../environments/${ENVIRONMENT}/backend.config"
            terraform workspace select -or-create "$ENVIRONMENT"

            # Plan file never leaves this job: a binary plan can carry state.
            terraform plan -input=false -out=tfplan
            terraform apply -input=false -auto-approve tfplan

            popd >/dev/null
            echo "::endgroup::"
          done

      - name: Read the CDN outputs
        id: outputs
        run: |
          set -euo pipefail

          pushd terraform/cdn >/dev/null
          {
            echo "bucket=$(terraform output -raw bucket_name)"
            echo "distribution=$(terraform output -raw distribution_id)"
            echo "kvs_arn=$(terraform output -raw key_value_store_arn)"
            echo "host_keys=$(terraform output -json host_keys | jq -c .)"
            echo "runtime_config=$(terraform output -json runtime_config_base | jq -c .)"
            echo "verify_url=$(terraform output -raw verify_url)"
            echo "domain=$(terraform output -raw url)"
          } >> "$GITHUB_OUTPUT"
          popd >/dev/null

          # Null until the AMP workspace exists, and `-raw` refuses a null.
          pushd terraform/observability-grafana >/dev/null
          echo "grafana_url=$(terraform output -raw amg_workspace_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          popd >/dev/null

  # Content-addressed, so a prefix already in the bucket is the same bytes and the whole job is a
  # no-op. Runs after terraform because the bucket is terraform's to create.
  publish:
    name: Publish Bundle
    runs-on: ubuntu-latest
    needs: [guard, terraform]
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: ${{ needs.guard.outputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Copy the bundle into the bucket
        env:
          BUCKET: ${{ needs.terraform.outputs.bucket }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if aws s3api head-object --bucket "$BUCKET" --key "${APP_SHA}/en.html" >/dev/null 2>&1; then
            echo "${APP_SHA} is already in ${BUCKET}."
            exit 0
          fi

          url=$(gh api "repos/${REPO}/actions/artifacts?name=${APP_SHA}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | first | .archive_download_url // empty')
          if [ -z "$url" ]; then
            echo "::error::No live bundle artifact named ${APP_SHA}. Re-run 'Build & Publish Release Bundle' for this tag to rebuild it."
            exit 1
          fi

          curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" -o artifact.zip "$url"
          unzip -q artifact.zip
          mkdir -p bundle && tar -xzf bundle.tgz -C bundle

          # Hashed filenames, so a browser may keep these forever.
          aws s3 sync bundle/_next "s3://${BUCKET}/${APP_SHA}/_next" --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'

          # A stable URL across bundles, so only the edge may hold it: max-age=0 stops a browser
          # pinning last week's document to this week's URL.
          aws s3 sync bundle "s3://${BUCKET}/${APP_SHA}" --exclude '_next/*' --only-show-errors \
            --cache-control 'public, max-age=0, must-revalidate, s-maxage=31536000'

          echo "Published ${APP_SHA} to ${BUCKET}."

  # The cutover itself: the bundle is already in the bucket, and this is what makes the hosts
  # answer from it.
  activate:
    name: Activate Bundle
    runs-on: ubuntu-latest
    needs: [guard, terraform, publish]
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.guard.outputs.environment }}
      url: ${{ needs.terraform.outputs.domain }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      # Pinned to the bundle, not to this release, so a release that ships content already serving
      # keeps the version that shipped it — what the footer shows stays the version actually live.
      - name: Resolve the version to serve
        id: version
        env:
          BUCKET: ${{ needs.terraform.outputs.bucket }}
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
          VERSION_TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail

          current=$(aws s3 cp "s3://${BUCKET}/${ENVIRONMENT}/runtime-config.json" - 2>/dev/null || echo '{}')
          app_version="$VERSION_TAG"

          if [ "$(jq -r '.bundle // empty' <<<"$current")" = "$APP_SHA" ]; then
            serving=$(jq -r '.appVersion // empty' <<<"$current")
            if [ -n "$serving" ]; then
              app_version="$serving"
              echo "${APP_SHA} already serves ${app_version}; keeping it."
            fi
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Write the environment's runtime config
        env:
          BUCKET: ${{ needs.terraform.outputs.bucket }}
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          BASE: ${{ needs.terraform.outputs.runtime_config }}
        run: |
          set -euo pipefail

          jq -n --argjson base "$BASE" --arg version "$APP_VERSION" --arg bundle "$APP_SHA" \
            '{allowDevMode: false, soloContracts: {}} + $base + {appVersion: $version, bundle: $bundle}' \
            > runtime-config.json
          cat runtime-config.json

          aws s3 cp runtime-config.json "s3://${BUCKET}/${ENVIRONMENT}/runtime-config.json" \
            --content-type application/json --cache-control 'no-cache' --only-show-errors

      # Terraform seeds these keys and ignores their value; nothing caches the store.
      - name: Point the hosts at the bundle
        env:
          KVS_ARN: ${{ needs.terraform.outputs.kvs_arn }}
          HOST_KEYS: ${{ needs.terraform.outputs.host_keys }}
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
        run: |
          set -euo pipefail

          value=$(jq -nc --arg bundle "$APP_SHA" --arg config "$ENVIRONMENT" '{bundle: $bundle, config: $config}')

          for host in $(jq -r '.[]' <<<"$HOST_KEYS"); do
            etag=$(aws cloudfront-keyvaluestore describe-key-value-store --kvs-arn "$KVS_ARN" \
              --no-cli-pager --query ETag --output text)
            aws cloudfront-keyvaluestore put-key --kvs-arn "$KVS_ARN" --if-match "$etag" \
              --key "$host" --value "$value" --no-cli-pager >/dev/null
            echo "${host} -> ${APP_SHA}"
          done

      # Only the config: every other key carries its bundle in the path, so nothing else can be
      # stale at the edge.
      - name: Invalidate the runtime config
        env:
          DISTRIBUTION: ${{ needs.terraform.outputs.distribution }}
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
        run: |
          set -euo pipefail

          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/runtime-config.json" "/${ENVIRONMENT}/runtime-config.json" \
            --no-cli-pager --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      # Against CloudFront's own name, so this passes before the public record moves and no cached
      # or weighted answer can stand in for it.
      - name: Confirm the CDN is serving
        env:
          VERIFY_URL: ${{ needs.terraform.outputs.verify_url }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 20); do
            served=$(curl -sf "${VERIFY_URL}/runtime-config.json" | jq -r '.appVersion // empty' || true)
            if [ "$served" = "$APP_VERSION" ]; then
              echo "${VERIFY_URL} serves ${served}."
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "::error::${VERIFY_URL} never served ${APP_VERSION} (last saw '${served}')."
              exit 1
            fi
            echo "Attempt ${attempt}/20: saw '${served}', retrying in 15s..."
            sleep 15
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "${VERIFY_URL}/" || true)
          if [ "$code" != "200" ]; then
            echo "::error::The home page returned '${code}'."
            exit 1
          fi

          # The router is what turns a URL into a key; a shape it rejects has to 404 rather than
          # fall through to a bundle document.
          code=$(curl -s -o /dev/null -w '%{http_code}' "${VERIFY_URL}/block/not-a-block" || true)
          if [ "$code" != "404" ]; then
            echo "::error::A malformed block id returned '${code}', expected 404."
            exit 1
          fi
          echo "The edge router is answering."

      - name: Summary
        env:
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          DOMAIN: ${{ needs.terraform.outputs.domain }}
          GRAFANA_URL: ${{ needs.terraform.outputs.grafana_url }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          {
            echo "### ${ENVIRONMENT} deployed — ${TAG}"
            echo
            echo "- Serving \`${APP_SHA}\` as \`${APP_VERSION}\`"
            echo "- ${DOMAIN}"
            if [ -n "$GRAFANA_URL" ]; then
              echo "- Grafana: ${GRAFANA_URL}/d/be-overview"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only the dev path drafts a release, and only when it was not hand-started: a
  # break-glass run may be redeploying an older tag, and drafting a release for
  # it would offer prod that rollback as the next cut.
  draft-release:
    name: Prepare Release Draft
    needs: [guard, activate]
    if: github.event_name == 'workflow_run'
    # Caps the called workflow rather than leaning on the repository default.
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-release.yml
    with:
      tag: ${{ needs.guard.outputs.tag }}
