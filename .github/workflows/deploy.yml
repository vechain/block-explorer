name: Deploy

# One workflow, both environments, target derived from the trigger:
#   image build finished  → dev   (every merge to main gets a v.X.Y.Z tag)
#   release published     → prod  (the single draft the dev deploy left)
#   dispatch              → either, break-glass
# vars.AWS_OIDC_ROLE_ARN resolves per GitHub Environment and prod approval is a
# protection rule on the same object, so no job below branches on the target.
on:
  workflow_run:
    workflows: ["Build & Publish Release Image"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      version:
        description: "Version tag to deploy (e.g. v.1.0.0). Defaults to the ref when dispatched from a tag."
        required: false
        type: string

run-name: >-
  Deploy ${{ inputs.version || github.event.workflow_run.head_branch || github.ref_name }}
  → ${{ github.event_name == 'release' && 'prod' || (inputs.environment || 'dev') }}

# From the event, not from guard: concurrency is evaluated before any job runs.
concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || (inputs.environment || 'dev') }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  TERRAFORM_VERSION: 1.16.0
  GHCR_REGISTRY: ghcr.io

jobs:
  # A v.* tag can be pushed to any branch, hence the ancestor check.
  guard:
    name: Resolve Target and Verify Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      tag: ${{ steps.resolve.outputs.tag }}
      ghcr_tag: ${{ steps.resolve.outputs.ghcr_tag }}
      app_sha: ${{ steps.derive.outputs.app_sha }}
      image_tag: ${{ steps.derive.outputs.image_tag }}
      alias_tag: ${{ steps.derive.outputs.alias_tag }}
      stacks: ${{ steps.derive.outputs.stacks }}
      domain: ${{ steps.derive.outputs.domain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve target and tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          # workflow_run always starts on the default branch and carries the tag
          # name in head_branch; a release starts on the tag itself.
          DEV_TAG: ${{ inputs.version || github.event.workflow_run.head_branch }}
          PROD_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            workflow_run)      environment=dev ;;
            release)           environment=prod ;;
            workflow_dispatch) environment="$INPUT_ENV" ;;
            *) echo "::error::Unsupported event: ${EVENT_NAME}"; exit 1 ;;
          esac

          # The credentialed jobs run whatever Terraform is in the tree they check
          # out, so the ref they start on is part of the security model. Dev takes
          # main's tree with the tag's image; prod takes the tag's own tree, which
          # is why a branch is refused there outright.
          case "$environment" in
            dev)
              raw_tag="$DEV_TAG"
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::Started on '${GITHUB_REF}'. Dispatch a dev deploy from main — it applies whatever Terraform it checks out."
                exit 1
              fi
              ;;
            prod)
              raw_tag="$PROD_TAG"
              if [[ "$GITHUB_REF" != refs/tags/* ]]; then
                echo "::error::Started on '${GITHUB_REF}'. Deploy prod from a tag, not a branch."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown environment: '${environment}'"; exit 1 ;;
          esac

          if [ -z "$raw_tag" ]; then
            echo "::error::No version to deploy. Pass the 'version' input when dispatching a dev deploy."
            exit 1
          fi

          # Anchored, so v.1.2.3junk is not a version. The optional suffix is for
          # prereleases, which deploy like any other published release.
          if [[ ! "$raw_tag" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version tag: '${raw_tag}'. Expected v.X.Y.Z."
            exit 1
          fi

          {
            echo "environment=${environment}"
            echo "tag=${raw_tag}"
            # GHCR strips the v. prefix.
            echo "ghcr_tag=${raw_tag#v.}"
          } >> "$GITHUB_OUTPUT"
          echo "${raw_tag} → ${environment}."

      - name: Verify the tag is reachable from main
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main
          SHA=$(git rev-list -n 1 "refs/tags/${TAG}")

          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${TAG} ($SHA) is not an ancestor of origin/main. Refusing to deploy unreviewed code."
            exit 1
          fi
          echo "${TAG} -> ${SHA}, reachable from main."

      # The content SHA is read at the tag, not at HEAD: a merge landing
      # mid-deploy must not move it.
      - name: Derive content SHA and environment names
        id: derive
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        run: |
          set -euo pipefail

          APP_SHA=$(bash scripts/app-content-sha.sh "refs/tags/${TAG}")

          # Dev's registry is shared with the previews, hence the prefix. Prod's
          # holds nothing but releases, and aliases the version onto the same
          # manifest for readability and the v.* lifecycle rule. Dev also owns
          # the two stacks prod has no copy of: the previews live in that
          # account, and so does the zone role dns/ hands prod.
          case "$ENVIRONMENT" in
            dev)
              image_tag="dev-${APP_SHA}"
              alias_tag=""
              stacks="dns network ecs acm edge preview-edge data observability-aws frontend observability-grafana"
              ;;
            prod)
              image_tag="${APP_SHA}"
              alias_tag="${TAG}"
              stacks="network ecs acm edge data observability-aws frontend observability-grafana"
              ;;
          esac

          domain=$(awk -F': *' '/^domain:/ {print $2; exit}' "terraform/environments/${ENVIRONMENT}/${ENVIRONMENT}.yaml")
          if [ -z "$domain" ]; then
            echo "::error::No domain in terraform/environments/${ENVIRONMENT}/${ENVIRONMENT}.yaml"
            exit 1
          fi

          {
            echo "app_sha=${APP_SHA}"
            echo "image_tag=${image_tag}"
            echo "alias_tag=${alias_tag}"
            echo "stacks=${stacks}"
            echo "domain=${domain}"
          } >> "$GITHUB_OUTPUT"
          echo "${TAG} carries app content ${APP_SHA}, deploying to ${domain}."

  # The manifest list, not one platform: the tasks are arm64.
  promote:
    name: Promote Image to ECR
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write
      contents: read
      packages: read
    environment:
      name: ${{ needs.guard.outputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each tag written only if absent — the repo is immutable.
      - name: Copy manifest list from GHCR to ECR
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}:${{ needs.guard.outputs.ghcr_tag }}
          ECR_REPO: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
          TAGS: ${{ needs.guard.outputs.image_tag }} ${{ needs.guard.outputs.alias_tag }}
        run: |
          set -euo pipefail

          present() {
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$1" --no-cli-pager >/dev/null 2>&1
          }

          read -ra wanted <<<"$TAGS"
          missing=()
          for tag in "${wanted[@]}"; do
            if present "$tag"; then
              echo "${tag} is already in ECR."
            else
              missing+=("$tag")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "This release ships content that is already here."
            exit 0
          fi

          for attempt in $(seq 1 6); do
            if docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::${GHCR_IMAGE} never appeared."
              exit 1
            fi
            echo "Attempt ${attempt}/6: ${GHCR_IMAGE} not published yet, retrying in 10s..."
            sleep 10
          done

          # Source is the GHCR version tag either way: on a reused build it is
          # already an alias of the same manifest the content tag points at.
          for tag in "${missing[@]}"; do
            docker buildx imagetools create -t "${ECR_REPO}:${tag}" "$GHCR_IMAGE"
          done

          docker buildx imagetools inspect "${ECR_REPO}:${IMAGE_TAG}"

  # Serial, each stack planned immediately before its own apply — see workflows/README.md.
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs: [guard, promote]
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.guard.outputs.environment }}
      url: https://${{ needs.guard.outputs.domain }}
    outputs:
      cluster: ${{ steps.outputs.outputs.cluster }}
      service: ${{ steps.outputs.outputs.service }}
      family: ${{ steps.outputs.outputs.family }}
      taskdef: ${{ steps.outputs.outputs.taskdef }}
      domain: ${{ steps.outputs.outputs.domain }}
      alb: ${{ steps.outputs.outputs.alb }}
      grafana_url: ${{ steps.outputs.outputs.grafana_url }}
    steps:
      # No `ref:` from event data: this job holds AWS credentials and Terraform runs the tree.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Pinned to the image, not to this release, so a no-op release registers no revision.
      - name: Pin the image tag and version
        env:
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
          VERSION_TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail

          family="block-explorer-${ENVIRONMENT}-frontend"
          running=$(aws ecs describe-task-definition --task-definition "$family" --no-cli-pager \
            --query "taskDefinition.containerDefinitions[?name=='frontend'] | [0]" --output json 2>/dev/null || true)

          app_version="$VERSION_TAG"
          if [ -n "${running:-}" ] && [ "$running" != "null" ]; then
            running_image=$(jq -r '.image // empty' <<<"$running")
            running_version=$(jq -r '.environment[]? | select(.name == "APP_VERSION") | .value' <<<"$running")
            if [ "${running_image##*:}" = "$IMAGE_TAG" ] && [ -n "$running_version" ]; then
              app_version="$running_version"
              echo "${IMAGE_TAG} already serves ${app_version}; keeping it."
            fi
          fi

          cd "terraform/environments/${ENVIRONMENT}"
          sed -i "s|^image_tag:.*|image_tag: ${IMAGE_TAG}|" "${ENVIRONMENT}.yaml"
          sed -i "s|^app_version:.*|app_version: ${app_version}|" "${ENVIRONMENT}.yaml"
          grep -E '^(image_tag|app_version):' "${ENVIRONMENT}.yaml"

      # Both role vars pass unconditionally; the inapplicable one resolves to "".
      - name: Plan and apply each stack
        env:
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          STACKS: ${{ needs.guard.outputs.stacks }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_prod_deploy_role_arn: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          TF_VAR_dns_role_arn: ${{ vars.DNS_WRITER_ROLE_ARN }}
        run: |
          set -euo pipefail

          read -ra ordered <<<"$STACKS"
          for stack in "${ordered[@]}"; do
            echo "::group::${stack}"
            pushd "terraform/${stack}" >/dev/null

            terraform init -input=false -backend-config="../environments/${ENVIRONMENT}/backend.config"
            terraform workspace select -or-create "$ENVIRONMENT"

            # Plan file never leaves this job: a binary plan can carry state.
            terraform plan -input=false -out=tfplan
            terraform apply -input=false -auto-approve tfplan

            popd >/dev/null
            echo "::endgroup::"
          done

      - name: Read service outputs
        id: outputs
        run: |
          set -euo pipefail

          pushd terraform/frontend >/dev/null
          {
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "service=$(terraform output -raw service_name)"
            echo "family=$(terraform output -raw task_definition_family)"
            echo "taskdef=$(terraform output -raw task_definition_arn)"
          } >> "$GITHUB_OUTPUT"
          popd >/dev/null

          pushd terraform/edge >/dev/null
          {
            echo "domain=$(terraform output -raw url)"
            echo "alb=$(terraform output -raw alb_dns_name)"
          } >> "$GITHUB_OUTPUT"
          popd >/dev/null

          # Null until the AMP workspace exists, and `-raw` refuses a null.
          pushd terraform/observability-grafana >/dev/null
          echo "grafana_url=$(terraform output -raw amg_workspace_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          popd >/dev/null

  # Terraform registered a new task definition revision but the service pins its
  # own, because the frontend stack ignores task_definition changes. Passing the
  # family is what moves the pointer - without it, --force-new-deployment just
  # redeploys the frozen one.
  roll:
    name: Roll ECS Service
    runs-on: ubuntu-latest
    needs: [guard, terraform]
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.guard.outputs.environment }}
      url: https://${{ needs.guard.outputs.domain }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      # Reverses hibernate-dev.yml, and heals one that only half-applied. Reads
      # the service rather than a flag, so a hand-scaled service wakes too, and
      # only acts below the floor — autoscaling above it is not ours to reset.
      - name: Wake the service if it is parked
        env:
          CLUSTER: ${{ needs.terraform.outputs.cluster }}
          SERVICE: ${{ needs.terraform.outputs.service }}
        run: |
          set -euo pipefail

          resource="service/${CLUSTER}/${SERVICE}"
          target=$(aws application-autoscaling describe-scalable-targets \
            --service-namespace ecs \
            --scalable-dimension ecs:service:DesiredCount \
            --resource-ids "$resource" \
            --no-cli-pager --query 'ScalableTargets[0]' --output json)

          floor=$(jq -r '.MinCapacity // 1' <<<"$target")
          suspended=$(jq -r '[.SuspendedState // {} | .[]] | any' <<<"$target")
          desired=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --no-cli-pager --query 'services[0].desiredCount' --output text)

          if [ "$desired" -ge "$floor" ] && [ "$suspended" = "false" ]; then
            echo "${SERVICE} is running ${desired} task(s) and scaling freely."
            exit 0
          fi

          restored=()

          if [ "$suspended" = "true" ]; then
            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --scalable-dimension ecs:service:DesiredCount \
              --resource-id "$resource" \
              --suspended-state '{"DynamicScalingInSuspended":false,"DynamicScalingOutSuspended":false,"ScheduledScalingSuspended":false}' \
              --no-cli-pager
            restored+=("target tracking resumed")
          fi

          if [ "$desired" -lt "$floor" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
              --desired-count "$floor" --no-cli-pager --query 'service.desiredCount' --output text
            restored+=("desired count ${desired} -> ${floor}")
          fi

          did=$(printf '%s, ' "${restored[@]}")
          {
            echo "### Woken from hibernation"
            echo
            echo "\`${SERVICE}\`: ${did%, }."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The revision rather than the image tag, so a cpu, memory, env or sidecar
      # change that leaves the image alone still rolls.
      - name: Check whether a roll is needed
        id: needed
        env:
          CLUSTER: ${{ needs.terraform.outputs.cluster }}
          SERVICE: ${{ needs.terraform.outputs.service }}
          DESIRED: ${{ needs.terraform.outputs.taskdef }}
        run: |
          set -euo pipefail

          running=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --no-cli-pager --query 'services[0].taskDefinition' --output text)

          if [ "$running" = "$DESIRED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on ${running} — nothing to roll."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Running ${running}, rolling to ${DESIRED}."
          fi

      - name: Deploy the new revision
        if: steps.needed.outputs.skip == 'false'
        env:
          CLUSTER: ${{ needs.terraform.outputs.cluster }}
          SERVICE: ${{ needs.terraform.outputs.service }}
          FAMILY: ${{ needs.terraform.outputs.family }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$FAMILY" \
            --force-new-deployment \
            --no-cli-pager \
            --query 'service.taskDefinition' --output text

          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      # By ALB name, not DNS, so no cached or weighted answer can pass this.
      - name: Confirm the new stack is serving
        env:
          DOMAIN: ${{ needs.terraform.outputs.domain }}
          ALB: ${{ needs.terraform.outputs.alb }}
        run: |
          set -euo pipefail

          host="${DOMAIN#https://}"
          via=("--connect-to" "${host}:443:${ALB}:443")

          for attempt in $(seq 1 20); do
            code=$(curl "${via[@]}" -s -o /dev/null -w '%{http_code}' "https://${host}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "${ALB} answers /api/health with 200 for ${host}."
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "::error::${ALB} never returned 200 for https://${host}/api/health."
              exit 1
            fi
            echo "Attempt ${attempt}/20: got '${code}', retrying in 15s..."
            sleep 15
          done

          # The ALB must refuse this even though the sidecar scrapes it in-task.
          code=$(curl "${via[@]}" -s -o /dev/null -w '%{http_code}' "https://${host}/api/metrics" || true)
          if [ "$code" != "403" ]; then
            echo "::error::/api/metrics returned '${code}' on the ALB, expected 403."
            exit 1
          fi
          echo "/api/metrics is closed at the ALB."

      - name: Summary
        env:
          ENVIRONMENT: ${{ needs.guard.outputs.environment }}
          SERVICE: ${{ needs.terraform.outputs.service }}
          DOMAIN: ${{ needs.terraform.outputs.domain }}
          GRAFANA_URL: ${{ needs.terraform.outputs.grafana_url }}
          APP_SHA: ${{ needs.guard.outputs.app_sha }}
          TAG: ${{ needs.guard.outputs.tag }}
          SKIPPED: ${{ steps.needed.outputs.skip }}
        run: |
          {
            echo "### ${ENVIRONMENT} deployed — ${TAG}"
            echo
            echo "- Service: \`${SERVICE}\`"
            if [ "$SKIPPED" = "true" ]; then
              echo "- Roll **skipped** — already running \`${APP_SHA}\` with an unchanged task definition."
            else
              echo "- Rolled to \`${APP_SHA}\`."
            fi
            echo "- ${DOMAIN}"
            if [ -n "$GRAFANA_URL" ]; then
              echo "- Grafana: ${GRAFANA_URL}/d/be-overview"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only the dev path drafts a release, and only when it was not hand-started: a
  # break-glass run may be redeploying an older tag, and drafting a release for
  # it would offer prod that rollback as the next cut.
  draft-release:
    name: Prepare Release Draft
    needs: [guard, roll]
    if: github.event_name == 'workflow_run'
    # Caps the called workflow rather than leaning on the repository default.
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-release.yml
    with:
      tag: ${{ needs.guard.outputs.tag }}
