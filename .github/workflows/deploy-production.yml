name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "!.github/workflows/deploy-production.yml"

  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  ENVIRONMENT: production
  TERRAFORM_VERSION: 1.6.0

jobs:
  prepare-metadata:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    
    steps:
      - name: Generate metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="prod-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: prepare-metadata
    uses: ./.github/workflows/build-push-ecr.yml
    with:
      ecr_repository: block-explorer
      image_tag: ${{ needs.prepare-metadata.outputs.image_tag }}
      aws_region: eu-west-1
    secrets:
      aws_role_arn: ${{ secrets.AWS_ACC_ROLE }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://block-explorer.vechain.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Update production config with new image tag
        run: |
          cd terraform/environments/production
          sed -i "s/^image_tag:.*/image_tag: ${{ needs.build-and-push.outputs.tag }}/" production.yaml
          cat production.yaml

      - name: Terraform Init
        working-directory: terraform/frontend
        run: |
          terraform init -backend-config=../environments/production/backend.config

      - name: Terraform Workspace
        working-directory: terraform/frontend
        run: |
          terraform workspace select production || terraform workspace new production

      - name: Terraform Plan
        working-directory: terraform/frontend
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        working-directory: terraform/frontend
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment URL
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        working-directory: terraform/frontend
        id: outputs
        run: |
          CUSTOM_URL=$(terraform output -raw custom_domain_url || echo "")
          SERVICE_URL=$(terraform output -raw service_url || echo "")
          echo "custom_url=${CUSTOM_URL}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: |
          echo "### Production Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.outputs.outputs.custom_url }}" ]; then
            echo "**Custom Domain:** ${{ steps.outputs.outputs.custom_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Service URL:** ${{ steps.outputs.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
