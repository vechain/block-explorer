name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/deploy-production.yml'

  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  ENVIRONMENT: production
  TERRAFORM_VERSION: 1.6.0

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="prod-${GITHUB_SHA::8}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://block-explorer.vechain.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Update production config with new image tag
        run: |
          cd terraform/environments/production
          sed -i "s/^image_tag:.*/image_tag: ${{ needs.build-and-push.outputs.image_tag }}/" production.yaml
          cat production.yaml

      - name: Terraform Init
        working-directory: terraform/frontend
        run: |
          terraform init -backend-config=../environments/production/backend.config

      - name: Terraform Workspace
        working-directory: terraform/frontend
        run: |
          terraform workspace select production || terraform workspace new production

      - name: Terraform Plan
        working-directory: terraform/frontend
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        working-directory: terraform/frontend
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment URL
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        working-directory: terraform/frontend
        id: outputs
        run: |
          CUSTOM_URL=$(terraform output -raw custom_domain_url || echo "")
          SERVICE_URL=$(terraform output -raw service_url || echo "")
          echo "custom_url=${CUSTOM_URL}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: |
          echo "### Production Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.outputs.outputs.custom_url }}" ]; then
            echo "**Custom Domain:** ${{ steps.outputs.outputs.custom_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Service URL:** ${{ steps.outputs.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY

