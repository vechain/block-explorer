name: Deploy to Production

on:
  release:
    types:
      - published

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: block-explorer
  ENVIRONMENT: prod
  TERRAFORM_VERSION: 1.10.0

jobs:
  validate-version-format:
    name: Confirm Version Format
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.validate-version-format.outputs.image_tag }}
    steps:
      - name: Confirm Version Format
        id: validate-version-format
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == v.* ]]; then
            echo "image_tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "error: Invalid version format. Expected v.X.Y.Z. Select a version tag when dispatching the workflow."
            exit 1
          fi

  promote-to-ecr:
    name: Promote GHCR Image to ECR
    runs-on: ubuntu-latest
    needs: validate-version-format
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_REPO: ${{ github.repository }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          VERSION: ${{ needs.validate-version-format.outputs.image_tag }}
        run: |
          # GHCR tags have the v. prefix stripped (v.1.0.0 -> 1.0.0)
          GHCR_TAG=$(echo "$VERSION" | sed 's/^v\.//')
          # ECR tags keep the original format (v.1.0.0)
          ECR_TAG="$VERSION"

          # Only push latest tag for stable versions (X.Y.Z)
          if echo "$GHCR_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> $GITHUB_OUTPUT
          else
            echo "stable=false" >> $GITHUB_OUTPUT
          fi

          echo "ghcr_tag=${GHCR_TAG}" >> $GITHUB_OUTPUT
          echo "tag=${ECR_TAG}" >> $GITHUB_OUTPUT

      - name: Wait for GHCR image availability
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:${{ steps.meta.outputs.ghcr_tag }}
        run: |
          for attempt in $(seq 1 6); do
            if docker buildx imagetools inspect "$GHCR_IMAGE" > /dev/null 2>&1; then
              echo "GHCR image is available: $GHCR_IMAGE"
              exit 0
            fi
            echo "Attempt $attempt/6: GHCR image not yet available, retrying in 10s..."
            sleep 10
          done
          echo "::error::GHCR image not found after 60s: $GHCR_IMAGE"
          exit 1

      - name: Copy image from GHCR to ECR
        env:
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}:${{ steps.meta.outputs.ghcr_tag }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker pull --platform linux/amd64 "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$ECR_IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$ECR_IMAGE:${{ steps.meta.outputs.tag }}"

          if [ "${{ steps.meta.outputs.stable }}" = "true" ]; then
            docker tag "$GHCR_IMAGE" "$ECR_IMAGE:latest"
            docker push "$ECR_IMAGE:latest"
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [promote-to-ecr]
    permissions:
      id-token: write
      contents: read
    environment:
      name: prod
      url: https://block-explorer.vechain.org

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACC_ROLE }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Update prod config with new image tag
        run: |
          cd terraform/environments/prod
          sed -i "s/^image_tag:.*/image_tag: ${{ needs.promote-to-ecr.outputs.tag }}/" prod.yaml
          cat prod.yaml

      - name: Terraform Init
        working-directory: terraform/frontend
        run: |
          terraform init -backend-config=../environments/prod/backend.config

      - name: Terraform Workspace
        working-directory: terraform/frontend
        run: |
          terraform workspace select prod

      - name: Terraform Plan
        working-directory: terraform/frontend
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/frontend
        run: |
          terraform apply -auto-approve tfplan

      - name: Get deployment URL
        working-directory: terraform/frontend
        id: outputs
        run: |
          CUSTOM_URL=$(terraform output -raw custom_domain_url || echo "")
          SERVICE_URL=$(terraform output -raw service_url || echo "")
          echo "custom_url=${CUSTOM_URL}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "### Production Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.promote-to-ecr.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.outputs.outputs.custom_url }}" ]; then
            echo "**Custom Domain:** ${{ steps.outputs.outputs.custom_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Service URL:** ${{ steps.outputs.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
