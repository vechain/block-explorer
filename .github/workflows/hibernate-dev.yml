name: Hibernate Dev

# Dev bills the same idle as busy. This parks its ECS service at zero tasks and
# brings it back on demand. A dev deploy wakes it too, so forgetting to wake
# costs nothing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "hibernate parks the service at zero tasks; wake restores it"
        required: true
        type: choice
        options:
          - hibernate
          - wake
        default: hibernate

run-name: ${{ inputs.mode == 'wake' && 'Wake dev' || 'Hibernate dev' }}

# deploy.yml's dev group, so this can never interleave with a dev deploy.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.16.0

jobs:
  capacity:
    name: Set Dev Capacity
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Declared for vars.AWS_OIDC_ROLE_ARN, which resolves per Environment. No
    # `url`: half of what this workflow does is make that URL stop answering.
    environment:
      name: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # From state, the way the deploy reads them: a name spelled out here would
      # scale nothing and still report success.
      - name: Read service outputs
        id: outputs
        working-directory: terraform/frontend
        run: |
          set -euo pipefail

          terraform init -input=false -backend-config=../environments/dev/backend.config
          terraform workspace select dev
          {
            echo "cluster=$(terraform output -raw cluster_name)"
            echo "service=$(terraform output -raw service_name)"
          } >> "$GITHUB_OUTPUT"

      # Suspended before the count drops, never after: Application Auto Scaling
      # holds the service at the target's min_capacity, so a live target scales
      # it straight back out. Terraform does not manage suspended_state, so the
      # suspension survives every apply until a wake lifts it.
      - name: Park the service
        if: inputs.mode == 'hibernate'
        env:
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: |
          set -euo pipefail

          resource="service/${CLUSTER}/${SERVICE}"
          target=$(aws application-autoscaling describe-scalable-targets \
            --service-namespace ecs \
            --scalable-dimension ecs:service:DesiredCount \
            --resource-ids "$resource" \
            --no-cli-pager --query 'ScalableTargets[0].ResourceId' --output text)

          if [ "$target" != "$resource" ]; then
            echo "No scalable target on ${SERVICE}; nothing to suspend."
          else
            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --scalable-dimension ecs:service:DesiredCount \
              --resource-id "$resource" \
              --suspended-state '{"DynamicScalingInSuspended":true,"DynamicScalingOutSuspended":true,"ScheduledScalingSuspended":true}' \
              --no-cli-pager
            echo "Target tracking suspended on ${SERVICE}."
          fi

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --desired-count 0 --no-cli-pager --query 'service.desiredCount' --output text
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "${SERVICE} is drained."

      # Restores to the target's own floor rather than to 1, so this stays right
      # if desired_count in the env YAML ever changes, and only from below it —
      # pressing wake on a service that is already up must not scale it in.
      - name: Wake the service
        if: inputs.mode == 'wake'
        env:
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: |
          set -euo pipefail

          resource="service/${CLUSTER}/${SERVICE}"
          target=$(aws application-autoscaling describe-scalable-targets \
            --service-namespace ecs \
            --scalable-dimension ecs:service:DesiredCount \
            --resource-ids "$resource" \
            --no-cli-pager --query 'ScalableTargets[0]' --output json)

          floor=$(jq -r '.MinCapacity // 1' <<<"$target")
          desired=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --no-cli-pager --query 'services[0].desiredCount' --output text)

          if [ "$(jq -r '[.SuspendedState // {} | .[]] | any' <<<"$target")" = "true" ]; then
            aws application-autoscaling register-scalable-target \
              --service-namespace ecs \
              --scalable-dimension ecs:service:DesiredCount \
              --resource-id "$resource" \
              --suspended-state '{"DynamicScalingInSuspended":false,"DynamicScalingOutSuspended":false,"ScheduledScalingSuspended":false}' \
              --no-cli-pager
            echo "Target tracking resumed on ${SERVICE}."
          fi

          if [ "$desired" -lt "$floor" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
              --desired-count "$floor" --no-cli-pager --query 'service.desiredCount' --output text
          fi

          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "${SERVICE} is serving on the revision it was parked with."

      - name: Summary
        env:
          MODE: ${{ inputs.mode }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: |
          {
            if [ "$MODE" = "hibernate" ]; then
              echo "### Dev hibernated"
              echo
              echo "- \`${SERVICE}\` is at zero tasks with target tracking suspended."
              echo "- https://dev.block-explorer.vechain.org now returns 503 — the ALB has no targets."
              echo "- Nothing alarms: dev sets \`alerts_enabled: false\`, so no alarms or AMP alert rules exist."
              echo "- Wake it by re-running this workflow with \`wake\`, or by deploying dev — the deploy wakes it on its own."
            else
              echo "### Dev woken"
              echo
              echo "- \`${SERVICE}\` is serving again and target tracking is live."
              echo "- https://dev.block-explorer.vechain.org"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
