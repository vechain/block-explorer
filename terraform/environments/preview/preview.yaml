# Previews — shared across every pr-N workspace, so nothing here is per-PR.
environment: preview
domain_suffix: block-explorer-preview.vechain.org

# ECS task. Sized as dev, not smaller: a preview that OOMs where dev does not is
# a bug report about the preview.
task_cpu: 512
task_memory: 1024
desired_count: 1
container_port: 3000

log_retention_days: 14
