# Dev environment — the static bundle on CloudFront, shared with every preview.
environment: dev
domain: dev.block-explorer.vechain.org

bundle_prefix: app-unpublished # Only seeds a first apply; the deploy owns the live value.
cdn_price_class: PriceClass_100

# Access logs in S3, the AMP and Lambda log groups, and the WAF log group.
log_retention_days: 30

grafana_okta_saml_metadata_url: https://vechaineu.okta.com/app/exk1020c50lQfO4EF418/sso/saml/metadata
grafana_admin_okta_groups: [APP_AMG_BLOCK_EXPLORER_Admin]
grafana_editor_okta_groups: [APP_AMG_BLOCK_EXPLORER_Editor]

# Off entirely: no CloudWatch alarms and no subscription.
alerts_enabled: false

# WAF. The rate-based IP rule always blocks; the AWS managed groups stay in
# Count until they have soaked against real traffic.
waf_enabled: true
waf_managed_rules_blocking: false
waf_rate_limit: 2000

# AS24940 is a large hosting network, so read the sampled requests before flipping.
waf_blocklist_blocking: false
waf_blocked_asns: [24940]
