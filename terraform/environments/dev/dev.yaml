# Dev environment — ECS Fargate on the dev ALB.
environment: dev
domain: dev.block-explorer.vechain.org

# Network
vpc_cidr: 10.30.0.0/16
az_count: 2
# An AZ outage takes dev egress with it, which is worth ~$65/month. Prod: false.
single_nat_gateway: true

# ECS task
image_tag: latest # Overwritten by the deploy with the content SHA it resolved.
task_cpu: 512
task_memory: 1024
desired_count: 1
# Scaling has nothing to react to here; it is on so prod does not run it first.
autoscaling_max: 2
container_port: 3000

# The dev name is ours to create. Prod's already answers on App Runner.
dns_record_enabled: true

log_retention_days: 30

# Dev calls the indexer through /api/indexer, so it needs no runtime overrides.
runtime_environment: {}

# Shared Valkey. Ceilings against a runaway bill, not a capacity plan — 1000 ECPU/s
# is the AWS floor, and the working set is tens of MB of decoded selectors and ABIs.
cache_data_storage_max_gb: 1
cache_ecpu_per_second_max: 1000

grafana_okta_saml_metadata_url: https://vechaineu.okta.com/app/exk1020c50lQfO4EF418/sso/saml/metadata
grafana_admin_okta_groups: [APP_AMG_BLOCK_EXPLORER_Admin]
grafana_editor_okta_groups: [APP_AMG_BLOCK_EXPLORER_Editor]

# Rules and alarms evaluate either way; this only gates Slack delivery.
alerts_enabled: false

# WAF. The rate-based IP rule always blocks; the AWS managed groups stay in
# Count until they have soaked against real traffic.
waf_enabled: true
waf_managed_rules_blocking: false
waf_rate_limit: 2000
