# Production. Read by the ECS stacks, and by the App Runner service still
# serving the domain until the cutover — its keys are the last block.
environment: prod
domain: block-explorer.vechain.org

# Network
vpc_cidr: 10.31.0.0/16
az_count: 2
# An AZ outage must not take prod egress with it. Dev: true.
single_nat_gateway: false

# ECS task. Four times dev: at 512 the two tasks pinned at 100% CPU the moment
# explore.vechain.org moved, which is the load App Runner ran on 2 vCPU each.
image_tag: latest # Overwritten by the deploy with the content SHA it resolved.
task_cpu: 2048
task_memory: 4096
desired_count: 2
autoscaling_max: 8
container_port: 3000

log_retention_days: 90

# BYPASS_INDEXER_PROXY carries over from App Runner: the indexer's WAF rate-limits
# our shared egress IP, so prod calls it from the browser rather than server-side.
runtime_environment:
  BYPASS_INDEXER_PROXY: 'true'

# Shared Valkey. Ceilings against a runaway bill, not a capacity plan.
cache_data_storage_max_gb: 5
cache_ecpu_per_second_max: 15000

# An AMG workspace is its own SAML audience, so prod needs its own Okta app.
grafana_okta_saml_metadata_url: https://vechaineu.okta.com/app/exk1033qa0eZpldKg418/sso/saml/metadata
grafana_admin_okta_groups: [APP_AMG_BLOCK_EXPLORER_Admin]
grafana_editor_okta_groups: [APP_AMG_BLOCK_EXPLORER_Editor]

# Needs SLACK_WEBHOOK_URL on the prod Environment, or the apply fails.
alerts_enabled: true

# The rate-based IP rule blocks from day one; the managed groups soak in Count.
waf_enabled: true
waf_managed_rules_blocking: false
waf_rate_limit: 2000

# The zone as the ramp left it. Rollback is a weight change, not a revert.
dns_record_enabled: true
dns_weight: 100

# The name users type, and effectively all of prod's traffic; the ramp above
# moved block-explorer.vechain.org only.
extra_domain:
  name: explore.vechain.org
  app_runner_target: hmhfp8n3wn.eu-west-1.awsapprunner.com
  # As its ramp left it. Rollback is a weight change, not a revert.
  dns_weight: 100
  app_runner_dns_weight: 0

# App Runner below: read only by the legacy app-runner/ stack, gone in phase 7.
region: eu-west-1
enable_custom_domain: true

# Drained. Held here for 24-48h before the service is deleted.
app_runner_dns_weight: 0

cpu: 2048
memory: 4096
port: 3000

min_size: 1 # Minumum allowed by app runner
max_size: 10
max_concurrency: 100 # Max concurrent requests per instance

health_check_path: /
node_env: production

environment_variables:
  NEXT_PUBLIC_NETWORK: mainnet
  # Temporary: drop once the indexer's CloudFront WAF honours x-rate-limit-bypass.
  BYPASS_INDEXER_PROXY: 'true'
